name: open-brain-reader
description: Read-only access to open-brain database for audit and reporting

databases:
  - name: primary
    type: postgres
    hostname: open-brain-postgres
    port: 5432
    database: open_brain
    user: open_brain_auditor_ro
    password: ${OPEN_BRAIN_AUDITOR_DB_PASSWORD}
    env_prefix: PG

tools:
  - "Read"
  - "Bash(psql*)"
  - "Bash(python3*)"
  - "Bash(date*)"
