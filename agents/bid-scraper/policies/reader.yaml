name: bid-scraper-reader
description: Read-only access to bid scraper database

databases:
  - name: primary
    type: postgres
    hostname: gov-bid-postgres
    port: 5432
    database: govbids
    user: auditor_ro
    password: ${BID_SCRAPER_DB_PASSWORD}
    env_prefix: PG

tools:
  - "Read"
  - "Bash(psql*)"
  - "Bash(python3*)"
  - "Bash(date*)"
